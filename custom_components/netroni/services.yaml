pair_channel:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: netroni
              model: XP-Mini
    channel:
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
unpair_channel:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: netroni
              model: XP-Mini
    channel:
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
