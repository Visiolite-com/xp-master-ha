pair_port:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: netroni
              model: XP-Mini
    port:
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
unpair_port:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: netroni
              model: XP-Mini
    port:
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
